  if(action==='close-modal'){closeModal();return;}

  if(action==='login'){navigate('login');return;}
  if(action==='sign-in'){navigate('feed');return;}
  if(action==='important'){state.important=!state.important;target.setAttribute('aria-pressed',String(state.important));filterFeed();return;}
  if(action==='filters'){state.filters=!state.filters;root.querySelector('.nw-filter-tray').hidden=!state.filters;target.setAttribute('aria-expanded',String(state.filters));return;}
  if(action==='clear-filters'){state.query='';state.important=false;state.market='Alle';state.category='Alle';state.issuer='Alle';state.scenario='normal';draw();return;}
  if(action==='reconnect'){state.scenario='normal';draw();return;}
  if(action==='new-notices'){state.newAdded=true;draw();return;}
  if(action==='show-full'){setSelected('nordvik','full');return;}
  if(action==='show-first'){setSelected('nordvik','first');return;}
  if(action==='new-version'){const a=articles[id];a.selected=a.availableVersion;a.availableVersion=null;draw();return;}
  if(action==='retry'){state.stage='draft';refreshStatus('nordvik');timers.push(setTimeout(()=>{state.stage='ready';refreshStatus('nordvik');},2800));return;}
  if(action==='more'){const m=root.querySelector('[data-menu="'+id+'"]');const open=m.hidden;root.querySelectorAll('[data-menu]').forEach(n=>n.hidden=true);m.hidden=!open;target.setAttribute('aria-expanded',String(open));return;}
  if(action==='sources'||action==='adjust'||action==='history'){state.side=action==='history'?'history':'sources';state.source='notice';state.article=id;if(id==='sak'){state.storyGenerated=true;navigate('story',id);}else navigate('desk',id);if(action==='adjust')root.querySelector('[data-input="instruction"]')?.focus();return;}
  if(action==='side-sources'||action==='side-history'){state.side=action==='side-sources'?'sources':'history';draw();return;}
  if(action==='source-notice'||action==='source-pdf'){state.source=action==='source-notice'?'notice':'pdf';draw();return;}
  if(action==='choose-version'){setSelected(state.article,target.dataset.key);return;}
  if(action==='titles'){
   state.article=id;const choices=id==='fjord'?['Fjordlogistikk sikrer tre nye år med svensk kunde','Ny avtale verdt 180 millioner for Fjordlogistikk','Fjordlogistikk forlenger svensk kontrakt']:['Nordvik kjøper svensk konkurrent for 2,4 milliarder','Nordvik blar opp 2,4 milliarder for Bergström','Milliardoppkjøp for Nordvik i Sverige'];
   modal('Titler',choices.map(t=>button('use-title',esc(t),'nw-proposal-title','data-title="'+esc(t)+'"')).join(''));return;
  }
  if(action==='use-title'){current().title=target.dataset.title;current().dirty=true;closeModal();draw();return;}
  if(action==='original'){state.article=id;const v=current();modal('AI-original','<h3>'+esc(v.originalTitle)+'</h3><div class="nw-source">'+paragraphs(v.originalBody)+'</div><div class="nw-row">'+button('restore-original','Bruk original','nw-end')+'</div>');return;}
  if(action==='restore-original'){const v=current();v.title=v.originalTitle;v.body=v.originalBody;v.dirty=false;closeModal();draw();return;}
  if(action==='copy'){
   const v=current(id),text=v.title+'\n\n'+v.body;
   try { if(!navigator.clipboard?.writeText)throw Error('unavailable');await navigator.clipboard.writeText(text);target.textContent='Kopiert';setTimeout(()=>{if(target.isConnected){target.innerHTML=icon('copy')+'Kopier';icons();}},1800); }
   catch { modal('Kopier','<textarea rows="9" aria-label="Tekst til kopiering" readonly>'+esc(text)+'</textarea>');ui('modal-body').querySelector('textarea').select(); }
   return;
  }
  if(action==='feedback'){state.article=id;modal('Meld feil','<textarea data-field="feedback" aria-label="Feilbeskrivelse" placeholder="Hva er feil?" rows="4"></textarea><div class="nw-row" style="margin-top:16px">'+button('send-feedback','Send','nw-main nw-end')+'</div>');return;}
  if(action==='send-feedback'){const field=root.querySelector('[data-field="feedback"]');if(!field.value.trim()){field.focus();return;}closeModal();toast('Registrert i demoen');return;}
  if(action==='add-source'){sourcesModal();return;}
  if(action==='source-mode'){sourcesModal(target.dataset.mode);return;}
  if(action==='demo-source'){addMaterial({title:'Nordvik · Oppkjøpspresentasjon',kind:'PDF',enabled:true},target.dataset.new==='true');return;}
  if(action==='save-source'){
   const mode=target.dataset.mode;let title='';
   if(mode==='url'){const field=root.querySelector('[data-field="source-url"]');if(!field.value.trim()||!field.checkValidity()){field.reportValidity();return;}title=field.value;}
   if(mode==='text'){const field=root.querySelector('[data-field="source-text"]');if(!field.value.trim()){field.focus();return;}title=root.querySelector('[data-field="source-title"]').value||'Kildetekst';}
   if(mode==='pdf'){const field=root.querySelector('[data-field="source-file"]');if(!field.files.length){field.click();return;}title=field.files[0].name;}
   addMaterial({title,kind:mode==='pdf'?'PDF':mode==='text'?'Tekst':'Lenke',enabled:true},target.dataset.new==='true');return;
  }
  if(action==='remove-material'){(target.dataset.new==='true'?newMaterials:materials).splice(Number(target.dataset.index),1);draw();return;}
  if(action==='generate-version'){
   if(state.regenerating)return;const articleId=state.article;const base=current(articleId);const snap={title:base.title,body:base.body};state.regenerating=true;draw();
   timers.push(setTimeout(()=>{const a=articles[articleId];const key='v'+Object.keys(a.versions).length;a.versions[key]=version('Ny versjon',snap.title,snap.body,'08:05');a.availableVersion=key;state.regenerating=false;refreshStatus(articleId);const b=root.querySelector('[data-do="generate-version"]');if(b){b.disabled=false;b.textContent='Lag versjon';}},2600));return;
  }
  if(action==='new-story'){state.storyGenerated=false;state.storyBusy=false;state.article='sak';newMaterials=[];storyTitle='';storyAngle='';storyLength='2500';navigate('story','sak');return;}
  if(action==='open-story'){state.storyGenerated=true;state.side='sources';articles.sak=savedStories[target.dataset.key||'nordvik'];if(articles.sak.materials)materials=articles.sak.materials;else{materials=[{title:'Børsmelding',kind:'Newsweb',enabled:true},{title:'Bakgrunn',kind:'Tekst',enabled:true}];articles.sak.materials=materials;}navigate('story','sak');return;}
  if(action==='create-story'){
   if(!newMaterials.some(m=>m.enabled))return;const customTitle=root.querySelector('[data-input="story-title"]')?.value;state.storyBusy=true;draw();
   timers.push(setTimeout(()=>{state.storyBusy=false;state.storyGenerated=true;materials=newMaterials.slice();articles.sak={issuer:'Min sak',ticker:materials.length+' kilder',time:'08:14',category:'',selected:'full',materials,versions:{full:version('Utkast',customTitle||'Nordvik kjøper svensk konkurrent',fullBody,'08:14')}};savedStories['new'+Object.keys(savedStories).length]=articles.sak;state.side='sources';draw();},2300));return;
  }
  if(action==='signal-tab'){state.signalTab=target.dataset.tab;draw();return;}
  if(action==='signal-detail'){modal('Generering','<div class="nw-source"><p>'+esc(target.textContent)+'</p><div class="nw-row nw-spread"><span>Status</span><span>Klar</span></div><details><summary>Detaljer</summary><p>Kilde lest · Utkast generert · Kontroll fullført</p></details></div>');return;}
  if(action==='numeric-detail'){modal('Nordvik · Tallkontroll','<div class="nw-source"><span class="nw-section-label">Kilde</span><p>Purchase price: <mark>NOK 2.4 billion</mark></p><span class="nw-section-label">Utkast</span><p>Oppkjøpet er verdt <mark>24 milliarder kroner</mark>.</p><span class="nw-section-label">Endret til</span><p>Oppkjøpet er verdt 2,4 milliarder kroner.</p><details><summary>Detaljer</summary><p>Beløp · Avvik mellom kilde og utkast<br>Registrert 08:03 · Redigering</p></details></div>');return;}
  if(action==='signal-error'){modal('Generering feilet','<div class="nw-source"><p>Vestby Eiendom · 07:58</p><p>Tidsavbrudd</p><details><summary>Tekniske detaljer</summary><p>Fase: skriving<br>Kjøring: eksempel-035<br>Ny kjøring kan startes fra meldingen.</p></details></div>');return;}
  if(action==='export-signals'){
   const blob=new Blob([JSON.stringify({demo:true,date:'2026-09-07',type:state.signalTab,rows:[{issuer:'Nordvik Industri',firstDraftSeconds:7,fullVersionSeconds:48}]},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='autoweb-signaler-demo.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return;
  }
  if(action==='vestby-source'){modal('Kilde','<h3>Vestby Eiendom selger lagerbygg i Drammen</h3><p>Vestby Eiendom har inngått avtale om salg av et lagerbygg i Drammen for 120 millioner kroner.</p>');return;}
  if(action==='manual-generate'){target.disabled=true;target.innerHTML='<span class="nw-spinner"></span>Skriver';timers.push(setTimeout(()=>{const card=target.closest('.nw-card');if(card){card.querySelector('h2').textContent='Havøy Shipping fastsetter rente på obligasjonslån';target.textContent='Klar';}},2100));return;}
  if(action==='older'){const empty=ui('empty');const old=document.createElement('article');old.className='nw-card nw-simple';old.innerHTML='<div class="nw-meta"><span>Strand Finans · STRF</span><time>07:40</time></div><h2>Strand Finans fullfører tilbakekjøp</h2><p>Selskapet har kjøpt tilbake 45.000 egne aksjer.</p>';empty.before(old);target.textContent='Alle lastet';target.disabled=true;return;}
 }
 root.addEventListener('click',event=>{
  const target=event.target.closest('[data-do]');
  if(target&&root.contains(target)){event.preventDefault();void handleAction(target);}
  else if(event.target===ui('modal-layer'))closeModal();
  if(!event.target.closest('.nw-pop-wrap')){ui('account-menu').hidden=true;root.querySelectorAll('[data-menu]').forEach(n=>n.hidden=true);root.querySelector('[data-do="account"]').setAttribute('aria-expanded','false');}
 });
 root.addEventListener('input',event=>{
  const target=event.target;
  if(target.matches('[data-edit]')){const id=target.dataset.id,v=current(id);v[target.dataset.edit]=target.innerText;v.dirty=true;const label=root.querySelector('[data-edit-status="'+id+'"]');if(label)label.textContent='● Redigert';}
  if(target.dataset.input==='search'){state.query=target.value;filterFeed();}
  if(target.dataset.input==='instruction')customInstruction=target.value;
  if(target.dataset.input==='story-title')storyTitle=target.value;
  if(target.dataset.input==='story-angle')storyAngle=target.value;
 });
 root.addEventListener('change',event=>{
  const target=event.target,key=target.dataset.change;
  if(key==='story-length')storyLength=target.value;
  if(key){state[key]=target.value;if(['market','category','issuer'].includes(key))filterFeed();else{root.style.colorScheme=state.theme==='system'?'light dark':state.theme;root.dataset.density=state.density;}}
  if(target.dataset.mute){const name=target.dataset.mute;state.muted=state.muted.filter(m=>m!==name);if(target.checked)state.muted.push(name);filterFeed();}
  if(target.dataset.material!=null){const list=target.dataset.new==='true'?newMaterials:materials;list[Number(target.dataset.material)].enabled=target.checked;if(state.view==='story'&&!state.storyGenerated){const b=root.querySelector('[data-do="create-story"]');if(b)b.disabled=!newMaterials.some(m=>m.enabled);}}
  if(target.type==='date'){const dates=root.querySelectorAll('input[type="date"]');if(dates.length===2){const matches=dates[0].value<='2026-09-07'&&dates[1].value>='2026-09-07';root.querySelectorAll('tbody tr').forEach(r=>r.hidden=!matches);}}
 });
 root.addEventListener('submit',event=>{event.preventDefault();if(event.target.dataset.form==='login')navigate('feed');});
 root.addEventListener('keydown',event=>{
  if(event.key==='Escape'){if(!ui('modal-layer').hidden)closeModal();else{root.querySelectorAll('[data-menu]').forEach(n=>n.hidden=true);ui('account-menu').hidden=true;}}
  if(event.key==='Tab'&&!ui('modal-layer').hidden){const all=[...ui('modal-layer').querySelectorAll('button,input,textarea,select')].filter(e=>!e.disabled&&!e.hidden);const first=all[0],last=all[all.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
 });
 draw();
 if(globalThis.Tweak){
  const design={scenario:'normal',density:'comfortable',theme:'system',mobile:false,motion:true};
  const tweak=new Tweak({container:root,onChange:()=>{
   timers.forEach(clearTimeout);state.regenerating=false;state.storyBusy=false;root.querySelector('[data-do="play"]').disabled=false;
   state.scenario=design.scenario;state.density=design.density;state.theme=design.theme;state.mobile=design.mobile;state.motion=design.motion;
   state.stage=design.scenario==='pending'?'pending':design.scenario==='writing'?'draft':design.scenario==='failure'?'failed':'ready';
   if(design.scenario!=='normal'){state.view='feed';articles.nordvik.selected='first';}
   state.newAdded=false;draw();
  }});
  tweak.addSelect(design,'scenario',{label:'Tilstand',options:[{label:'Utfyllende klar',value:'normal'},{label:'Førsteutkast lages',value:'pending'},{label:'Utfyllende lages',value:'writing'},{label:'Utfyllende feilet',value:'failure'},{label:'Nye meldinger',value:'new'},{label:'Ingen treff',value:'empty'},{label:'Frakoblet',value:'offline'}]});
  tweak.addSelect(design,'theme',{label:'Utseende',options:[{label:'System',value:'system'},{label:'Lyst',value:'light'},{label:'Mørkt',value:'dark'}]});
  tweak.addSelect(design,'density',{label:'Avstand',options:[{label:'Normal',value:'comfortable'},{label:'Tett',value:'compact'}]});
  tweak.addToggle(design,'mobile',{label:'Mobilvisning'});tweak.addToggle(design,'motion',{label:'Animasjon'});
 }
})();
</script>
