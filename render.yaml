services:
  - type: keyvalue
    name: newsweb-explain-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: autoweb
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: starter
    preDeployCommand: npm run prisma:migrate:deploy
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 4000
      - key: API_BASE_URL
        value: http://127.0.0.1:4000
      - key: DATABASE_URL
        fromDatabase:
          name: newsweb-explain-db
          property: connectionString
      - key: GENERATION_LOG_DATABASE_URL
        fromDatabase:
          name: newsweb-explain-log-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: newsweb-explain-redis
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: DEV_AUTH_BYPASS
        value: false
      - key: LOGIN_USERNAME
        value: E24
      - key: LOGIN_PASSWORD
        sync: false
      - key: MAGIC_LINK_BASE_URL
        value: https://autoweb-f4dw.onrender.com/login
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASS
        value: ""
      - key: SMTP_FROM
        value: noreply@example.com
      - key: ADMIN_API_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_FAST_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_HARD_MODEL
        value: gpt-5.6-sol
      - key: OPENAI_SERVICE_TIER
        value: default
      - key: OPENAI_TIMEOUT_MS
        value: 240000
      - key: OPENAI_FAST_TIMEOUT_MS
        value: 15000
      - key: OPENAI_DEFAULT_REASONING_EFFORT
        value: medium
      - key: OPENAI_REPORT_REASONING_EFFORT
        value: medium
      - key: OPENAI_HARD_REASONING_EFFORT
        value: xhigh
      - key: OPENAI_TRIAGE_REASONING_EFFORT
        value: none
      - key: OPENAI_REFERENCE_REASONING_EFFORT
        value: medium
      - key: OPENAI_REVIEW_REASONING_EFFORT
        value: medium
      - key: OPENAI_PROMPT_CACHE_MODE
        value: implicit
      # NUMERIC_ACCEPTANCE_RULES is deliberately NOT declared here: an unset
      # env means "use the prompt-kit code default", while any set value -
      # including "" - overrides it exactly ("" = every derivation rule off).
      # Emergency rollback: add the var in the Render dashboard, no deploy.
      - key: POLL_INTERVAL_MS
        value: 5000
      - key: LATEST_BOOTSTRAP_COUNT
        value: 30

databases:
  - name: newsweb-explain-db
    databaseName: newsweb_explain
    user: newsweb
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
  - name: newsweb-explain-log-db
    databaseName: newsweb_generation_logs
    user: newsweblog
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
